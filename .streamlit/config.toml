[theme]
# Light is the default so the app reads well on a projector. A dark palette is available from
# the Appearance control in the sidebar; both are styled in scamshield/ui.py.
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f3f6fc"
secondaryBackgroundColor = "#eef3fb"
textColor = "#16223a"
font = "sans serif"

[server]
headless = true
# Off on purpose: hot-reloading mid-demo can re-import modules while the model is loaded.
runOnSave = false

[browser]
gatherUsageStats = false
